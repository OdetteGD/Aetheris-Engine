name: Aetheris Mono Glue Bootstrap

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  generate-mono-glue:
    name: Generate Aetheris C# API glue (bootstrap only)
    runs-on: ubuntu-26.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100

      - name: Restore Mono glue cache
        id: glue-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            modules/mono/glue/GodotSharp/GodotSharp/Generated
            modules/mono/glue/GodotSharp/GodotSharpEditor/Generated
          key: aetheris-mono-glue-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'modules/**/*.h', 'modules/**/*.cpp', 'modules/**/*.hpp', 'modules/**/*.inc', '!modules/mono/glue/**') }}

      - name: Stop if glue cache already exists
        if: steps.glue-cache.outputs.cache-hit == 'true'
        run: |
          test -s modules/mono/glue/GodotSharp/GodotSharp/Generated/GeneratedIncludes.props
          test -s modules/mono/glue/GodotSharp/GodotSharpEditor/Generated/GeneratedIncludes.props

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: android-editor-mono
        continue-on-error: true

      - name: Setup Python and SCons
        if: steps.glue-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/godot-deps

      - name: Build host-only Mono API generator
        if: steps.glue-cache.outputs.cache-hit != 'true'
        shell: sh
        run: |
          scons platform=linuxbsd target=editor \
            module_text_server_fb_enabled=yes \
            module_mono_enabled=yes \
            module_raycast_enabled=no \
            production=yes \
            cache_path=.scons_cache \
            redirect_build_objects=no

      - name: Locate host Mono editor generator
        if: steps.glue-cache.outputs.cache-hit != 'true'
        shell: sh
        run: |
          set -eu
          echo "Built Linux editor binaries:"
          find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.x86_64*' -print | sort
          GENERATOR="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.x86_64*' -perm -111 -print | grep '\.mono$' | head -n 1 || true)"
          if [ -z "$GENERATOR" ]; then
            GENERATOR="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.x86_64*' -perm -111 -print | head -n 1 || true)"
          fi
          if [ -z "$GENERATOR" ]; then
            echo "ERROR: no executable Linux Mono/editor generator was produced."
            exit 1
          fi
          echo "AETHERIS_MONO_GLUE_GENERATOR=$GENERATOR" >> "$GITHUB_ENV"
          echo "Using generator: $GENERATOR"

      - name: Generate platform-neutral C# API glue
        if: steps.glue-cache.outputs.cache-hit != 'true'
        shell: sh
        run: |
          set -eu
          test -n "${AETHERIS_MONO_GLUE_GENERATOR}"
          test -x "${AETHERIS_MONO_GLUE_GENERATOR}"
          "${AETHERIS_MONO_GLUE_GENERATOR}" --headless --generate-mono-glue modules/mono/glue
          test -s modules/mono/glue/GodotSharp/GodotSharp/Generated/GeneratedIncludes.props
          test -s modules/mono/glue/GodotSharp/GodotSharpEditor/Generated/GeneratedIncludes.props

      - name: Save host generator build cache
        if: steps.glue-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: android-editor-mono
        continue-on-error: true

      - name: Save shared Mono glue cache
        if: steps.glue-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            modules/mono/glue/GodotSharp/GodotSharp/Generated
            modules/mono/glue/GodotSharp/GodotSharpEditor/Generated
          key: aetheris-mono-glue-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'modules/**/*.h', 'modules/**/*.cpp', 'modules/**/*.hpp', 'modules/**/*.inc', '!modules/mono/glue/**') }}
