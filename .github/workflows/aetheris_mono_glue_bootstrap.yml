name: Aetheris Mono Glue Bootstrap

on:
  workflow_dispatch:

jobs:
  generate-mono-glue:
    name: Generate Aetheris C# API glue (bootstrap only)
    runs-on: ubuntu-26.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100

      - name: Restore Mono glue cache
        id: glue-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            modules/mono/glue/GodotSharp/GodotSharp/Generated
            modules/mono/glue/GodotSharp/GodotSharpEditor/Generated
          key: aetheris-mono-glue-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'modules/**/*.h', 'modules/**/*.cpp', 'modules/**/*.hpp', 'modules/**/*.inc') }}
          restore-keys: |
            aetheris-mono-glue-

      - name: Stop if glue cache already exists
        if: steps.glue-cache.outputs.cache-hit == 'true'
        run: |
          test -s modules/mono/glue/GodotSharp/GodotSharp/Generated/GeneratedIncludes.props
          test -s modules/mono/glue/GodotSharp/GodotSharpEditor/Generated/GeneratedIncludes.props

      - name: Setup Python and SCons
        if: steps.glue-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/godot-deps

      - name: Build host-only Mono API generator
        if: steps.glue-cache.outputs.cache-hit != 'true'
        shell: sh
        run: |
          scons platform=linuxbsd target=editor             module_text_server_fb_enabled=yes             module_mono_enabled=yes             production=yes             cache_path=.scons_cache             redirect_build_objects=no

      - name: Generate platform-neutral C# API glue
        if: steps.glue-cache.outputs.cache-hit != 'true'
        shell: sh
        run: |
          test -x bin/godot.linuxbsd.editor.x86_64
          ./bin/godot.linuxbsd.editor.x86_64 --headless --generate-mono-glue modules/mono/glue
          test -s modules/mono/glue/GodotSharp/GodotSharp/Generated/GeneratedIncludes.props
          test -s modules/mono/glue/GodotSharp/GodotSharpEditor/Generated/GeneratedIncludes.props

      - name: Save shared Mono glue cache
        if: steps.glue-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            modules/mono/glue/GodotSharp/GodotSharp/Generated
            modules/mono/glue/GodotSharp/GodotSharpEditor/Generated
          key: aetheris-mono-glue-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'modules/**/*.h', 'modules/**/*.cpp', 'modules/**/*.hpp', 'modules/**/*.inc') }}
