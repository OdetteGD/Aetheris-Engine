name: Aetheris Android C# Editor

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  android-editor-csharp:
    name: Aetheris C# Android Editor (arm64)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up .NET 10 for Android C#
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
          cache: true

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: android-editor-mono
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      - name: Download Perfetto
        shell: sh
        run: |
          python ./misc/scripts/install_perfetto.py

      - name: Build Aetheris Android C# editor
        uses: ./.github/actions/godot-build
        with:
          platform: android
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            arch=arm64
            production=yes
            module_mono_enabled=yes
            profiler=perfetto
            swappy=yes

      - name: Build temporary Linux Mono editor for C# glue generation
        shell: sh
        run: |
          scons platform=linuxbsd target=editor             dev_mode=yes             module_text_server_fb_enabled=yes             module_mono_enabled=yes             production=yes             cache_path=.scons_cache             redirect_build_objects=no

      - name: Generate C# Mono glue for the editor API
        shell: sh
        run: |
          test -x bin/godot.linuxbsd.editor.x86_64
          ./bin/godot.linuxbsd.editor.x86_64 --headless --generate-mono-glue modules/mono/glue
          test -s modules/mono/glue/GodotSharp/GodotSharp/Generated/GeneratedIncludes.props
          test -s modules/mono/glue/GodotSharp/GodotSharpEditor/Generated/GeneratedIncludes.props

      - name: Save Godot build cache after native builds
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: android-editor-mono
        continue-on-error: true

      - name: Install .NET for Android workload
        run: |
          dotnet workload install android --skip-manifest-update
          dotnet workload list

      - name: Build Godot C# assemblies for Android
        run: |
          dotnet --info
          ./modules/mono/build_scripts/build_assemblies.py             --godot-output-dir=./bin             --godot-platform=android             --android-architecture=arm64             --werror

      - name: Generate Android C# editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..

      - name: Verify Android C# editor APK
        run: |
          test -s bin/android_editor_builds/android_editor-android-debug.apk
          unzip -l bin/android_editor_builds/android_editor-android-debug.apk | grep -E 'lib/arm64-v8a/.*\.so'
          unzip -l bin/android_editor_builds/android_editor-android-debug.apk | grep -E 'godotsharp|GodotSharp|libmono|libcoreclr|libdotnet' || true

      - name: Upload Aetheris Android C# editor
        uses: ./.github/actions/upload-artifact
        with:
          name: Aetheris-Engine-Android-CSharp-Editor-arm64
          path: bin/android_editor_builds/android_editor-android-debug.apk
